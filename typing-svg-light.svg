<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 450 35'
    style='background-color: #00000000;'
    width='450px' height='35px'>

    
                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='6000ms' fill='remove'
                    values='m0,17.5 h0 ; m0,17.5 h450 ; m0,17.5 h450 ; m0,17.5 h0' keyTimes='0;0.66666666666667;0.83333333333333;1' />
                    </path>
    <text font-family='"system-ui", monospace' fill='#1F2328' font-size='20'
        dominant-baseline='auto'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Thanks for visiting my profile ❤️
        </textPath>
    </text>
</svg>
