name: Automated Profile Updater

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # জব ১: শুধুমাত্র Vercel সার্ভার চেক করবে
  check-vercel-status:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api?username=anis-mondal")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success! Vercel server is awake. (Status: $HTTP_STATUS)"
          else
            echo "Warning: Server might be down. (Status: $HTTP_STATUS)"
          fi

  # জব ২: শুধুমাত্র Snake জেনারেট করে আউটপুট ব্রাঞ্চে পুশ করবে
  generate-github-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bb9af7&color_dots=#ebedf0,#c2d6f9,#9abff4,#7aa2f7,#3d59a1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b26,#273a5e,#395587,#5a7bb0,#7aa2f7
      
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false 
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # জব ৩: শুধুমাত্র README ফাইল আপডেট করবে এবং পুশ করবে
  update-and-push-readme:
    needs: [check-vercel-status, generate-github-snake]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Version Numbers Based on API Status
        run: |
          RAND_NUM=$RANDOM
          
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api/top-langs/?username=anis-mondal") -eq 200 ]; then
            sed -i -E "/api\/top-langs/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api?username=anis-mondal&show_icons=true") -eq 200 ]; then
            sed -i -E "/api\?username=anis-mondal&show_icons/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://streak-stats.demolab.com/?user=anis-mondal") -eq 200 ]; then
            sed -i -E "/streak-stats\.demolab\.com/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=anis-mondal") -eq 200 ]; then
            sed -i -E "/github-profile-summary-cards/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://raw.githubusercontent.com/anis-mondal/anis-mondal/output/github-contribution-grid-snake.svg") -eq 200 ]; then
            sed -i -E "/github-contribution-grid-snake/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://readme-typing-svg.demolab.com?font=system-ui") -eq 200 ]; then
            sed -i -E "/readme-typing-svg/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://capsule-render.vercel.app/api?type=waving") -eq 200 ]; then
            sed -i -E "/capsule-render/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update valid image cache busters & snake [skip ci]"
          git push

  # জব ৪: গিটহাবের CDN সিঙ্ক হওয়ার জন্য অপেক্ষা করবে
  wait-for-cdn-sync:
    needs: update-and-push-readme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Pushed Code
        uses: actions/checkout@v4
        with:
          ref: main 
      - name: Dynamic Polling for GitHub CDN Sync
        run: |
          LOCAL_HASH=$(md5sum README.md | awk '{print $1}')
          for i in {1..30}; do
            REMOTE_HASH=$(curl -s -H "Cache-Control: no-cache" "https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.repository }}/main/README.md" | md5sum | awk '{print $1}')
            if [ "$LOCAL_HASH" == "$REMOTE_HASH" ]; then
              echo "✅ Success! GitHub server is synced."
              exit 0
            fi
            sleep 2
          done

  # জব ৫: গিটহাবের Camo ক্যাশ সার্ভার ক্লিয়ার করার রিকোয়েস্ট পাঠাবে
  prepare-github-camo:
    needs: update-and-push-readme
    runs-on: ubuntu-latest
    steps:
      - name: Clear Path for New Cache
        run: |
          echo "Sending initial no-cache headers to clear old cache paths..."
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository_owner }}"
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository }}"

  # জব ৬: ডেটা লোড হওয়ার জন্য প্রস্তুত কি না তা চেক করবে (API Readiness)
  verify-api-readiness:
    needs: [wait-for-cdn-sync, prepare-github-camo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify API Data Availability
        run: |
          echo "Checking if the external APIs have generated the new data..."
          grep -oE 'https?://[^ )">]+' README.md | while read -r URL; do
            if [[ "$URL" == *"vercel.app"* ]] || [[ "$URL" == *"demolab.com"* ]] || [[ "$URL" == *"githubusercontent"* ]]; then
              READY=false
              for i in {1..10}; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                if [ "$STATUS" -eq 200 ]; then
                  echo "✅ Data ready for: $URL"
                  READY=true
                  break
                fi
                sleep 2
              done
            fi
          done

  # জব ৭: প্রস্তুত হওয়া ডেটাগুলো ডাউনলোড করে ক্যাশ তৈরি করবে
  preload-images-to-cache:
    needs: verify-api-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull Data from APIs
        run: |
          echo "🚀 Pulling data to build GitHub Camo cache..."
          grep -oE 'https?://[^ )">]+' README.md | while read -r URL; do
            if [[ "$URL" == *"vercel.app"* ]] || [[ "$URL" == *"demolab.com"* ]] || [[ "$URL" == *"githubusercontent"* ]]; then
              curl -s -o /dev/null "$URL"
            fi
          done

  # জব ৮: একদম শেষে প্রোফাইল পেজ রিফ্রেশ করে প্রসেস শেষ করবে
  final-profile-refresh:
    needs: preload-images-to-cache
    runs-on: ubuntu-latest
    steps:
      - name: Force Refresh Profile Page
        run: |
          echo "🔥 Final profile refresh..."
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository_owner }}"
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository }}"
          echo "🎉 Done! Everything is 100% perfectly updated and cached."
