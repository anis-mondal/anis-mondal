name: Automated Profile Updater

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ১. প্রথম জব: Vercel Server চেক করা
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api?username=anis-mondal")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success! Vercel server is awake. (Status: $HTTP_STATUS)"
          else
            echo "Warning: Server might be down. (Status: $HTTP_STATUS)"
          fi

  # ২. দ্বিতীয় জব: Snake Generate করা (ping-server শেষ হলে চলবে)
  generate-snake:
    needs: ping-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bb9af7&color_dots=#ebedf0,#c2d6f9,#9abff4,#7aa2f7,#3d59a1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b26,#273a5e,#395587,#5a7bb0,#7aa2f7
      
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false 
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ৩. তৃতীয় জব: README আপডেট করা এবং পুশ করা (generate-snake শেষ হলে চলবে)
  update-readme:
    needs: generate-snake 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update Version Numbers Based on API Status
        run: |
          RAND_NUM=$RANDOM
          
          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api/top-langs/?username=anis-mondal") -eq 200 ]; then
            sed -i -E "/api\/top-langs/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Top Langs updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api?username=anis-mondal&show_icons=true") -eq 200 ]; then
            sed -i -E "/api\?username=anis-mondal&show_icons/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "General Stats updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://streak-stats.demolab.com/?user=anis-mondal") -eq 200 ]; then
            sed -i -E "/streak-stats\.demolab\.com/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Streak Stats updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=anis-mondal") -eq 200 ]; then
            sed -i -E "/github-profile-summary-cards/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Profile Details updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://raw.githubusercontent.com/anis-mondal/anis-mondal/output/github-contribution-grid-snake.svg") -eq 200 ]; then
            sed -i -E "/github-contribution-grid-snake/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Snake updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://readme-typing-svg.demolab.com?font=system-ui") -eq 200 ]; then
            sed -i -E "/readme-typing-svg/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Typing SVG updated."
          fi

          if [ $(curl -s -o /dev/null -w "%{http_code}" "https://capsule-render.vercel.app/api?type=waving") -eq 200 ]; then
            sed -i -E "/capsule-render/s/&v=[0-9]+/\&v=$RAND_NUM/g" README.md
            echo "Capsule Render updated."
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # it commit is any changes happened
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update valid image cache busters & snake"
          git push

  # ৪. চতুর্থ ও শেষ জব: Cache Warm-up (update-readme শেষ হলে চলবে)
  warmup-cache:
    needs: update-readme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (To get the updated README)
        uses: actions/checkout@v3

      - name: Aggressive Cache Warm-up (Load All APIs & Profile)
        run: |
          echo "Warming up GitHub's cache and external APIs..."
          
          # ১. গিটহাব প্রোফাইল এবং রিপোজিটরি পেজ লোড করা
          curl -s -o /dev/null "https://github.com/${{ github.repository_owner }}"
          curl -s -o /dev/null "https://github.com/${{ github.repository }}"
          
          # ২. আপডেট হওয়া README.md ফাইল থেকে নতুন লিঙ্কগুলো বের করে হিট করা
          grep -oE 'https?://[^ )">]+' README.md | while read -r URL; do
            if [[ "$URL" == *"vercel.app"* ]] || [[ "$URL" == *"demolab.com"* ]] || [[ "$URL" == *"githubusercontent"* ]]; then
              echo "Pinging API to pre-render: $URL"
              curl -s -o /dev/null "$URL"
            fi
          done
          
          echo "Knock Successful! All images and profile cache are fully warmed up."
