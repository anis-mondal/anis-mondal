name: Automated Profile Updater

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # জব ১: শুধুমাত্র Vercel সার্ভার চেক করবে
  check-vercel-status:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://my-github-stats-brown.vercel.app/api?username=anis-mondal")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success! Vercel server is awake."
          else
            echo "Warning: Server might be down."
          fi

  # জব ২: Snake জেনারেট এবং কার্ড ডাউনলোড করে পুশ করবে
  generate-github-snake:
    runs-on: ubuntu-latest
    # এখানে জব-৩ এর জন্য সিগন্যাল (outputs) তৈরি করা হচ্ছে
    outputs:
      top_langs_status: ${{ steps.download_step.outputs.top_langs_status }}
      github_stats_status: ${{ steps.download_step.outputs.github_stats_status }}
      streak_status: ${{ steps.download_step.outputs.streak_status }}
      profile_details_status: ${{ steps.download_step.outputs.profile_details_status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Checkout Output Branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: dist
        continue-on-error: true
      
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bb9af7&color_dots=#ebedf0,#c2d6f9,#9abff4,#7aa2f7,#3d59a1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b26,#273a5e,#395587,#5a7bb0,#7aa2f7
      
      - name: Download and Verify Cards
        id: download_step
        run: |
          mkdir -p dist
          
          # ফাংশন: ডাউনলোড সফল হলে 'success', ব্যর্থ হলে 'failed' সিগন্যাল পাঠাবে
          download_card() {
            local url=$1
            local filename="dist/$2"
            local tempname="temp_$2"
            local signal_name=$3
            
            HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$tempname" "$url")
            
            if [ "$HTTP_STATUS" -eq 200 ] && ! grep -qi "rate limited\|ERROR" "$tempname"; then
               mv "$tempname" "$filename"
               echo "✅ Success: $2 updated."
               echo "$signal_name=success" >> $GITHUB_OUTPUT
            else
               echo "❌ Error on $2. Keeping old file."
               rm -f "$tempname"
               echo "$signal_name=failed" >> $GITHUB_OUTPUT
            fi
          }
          
          download_card "https://my-github-stats-brown.vercel.app/api/top-langs/?username=anis-mondal&theme=tokyonight&hide_border=true&layout=compact&bg_color=00000000" "top-langs.svg" "top_langs_status"
          download_card "https://my-github-stats-brown.vercel.app/api?username=anis-mondal&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&bg_color=00000000&ring_color=f7da5c&title_color=38bdae&text_color=7aa2f7" "github-stats.svg" "github_stats_status"
          download_card "https://streak-stats.demolab.com/?user=anis-mondal&theme=tokyonight&hide_border=true&stroke=38b6ff&background=transparent&sideNums=bb9af7&ring=f5789f&fire=fb5995&currStreakLabel=7aa2f7" "streak.svg" "streak_status"
          download_card "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=anis-mondal&theme=tokyonight&bg_color=00000000" "profile-details.svg" "profile_details_status"

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false 
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # জব ৩: README ফাইল আপডেট করবে (শুধুমাত্র সফল ডাউনলোড হওয়া কার্ডগুলোর লিংক বদলাবে)
  update-and-push-readme:
    needs: [check-vercel-status, generate-github-snake]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Version Numbers Based on Download Success
        run: |
          RAND_NUM=$RANDOM
          
          # জব-২ থেকে পাওয়া সিগন্যাল চেক করে লিংক আপডেট করা হচ্ছে
          if [ "${{ needs.generate-github-snake.outputs.top_langs_status }}" == "success" ]; then
            sed -i -E "/top-langs\.svg/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          fi
          
          if [ "${{ needs.generate-github-snake.outputs.github_stats_status }}" == "success" ]; then
            sed -i -E "/github-stats\.svg/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          fi
          
          if [ "${{ needs.generate-github-snake.outputs.streak_status }}" == "success" ]; then
            sed -i -E "/streak\.svg/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          fi
          
          if [ "${{ needs.generate-github-snake.outputs.profile_details_status }}" == "success" ]; then
            sed -i -E "/profile-details\.svg/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          fi
          
          # স্নেক এবং অন্যান্য লাইভ লিংক সবসময় আপডেট হবে
          sed -i -E "/github-contribution-grid-snake/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          sed -i -E "/readme-typing-svg/s/v=[0-9]+/v=$RAND_NUM/g" README.md
          sed -i -E "/capsule-render/s/v=[0-9]+/v=$RAND_NUM/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update valid image cache busters [skip ci]"
          git push

  # জব ৪: গিটহাবের লাইভ সার্ভারে ডেটা সিঙ্ক হওয়ার জন্য অপেক্ষা
  wait-for-github-sync:
    needs: update-and-push-readme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Pushed Code
        uses: actions/checkout@v4
        with:
          ref: main 
      - name: Dynamic Polling for Sync
        run: |
          LOCAL_HASH=$(md5sum README.md | awk '{print $1}')
          for i in {1..15}; do
            REMOTE_HASH=$(curl -s -H "Cache-Control: no-cache" "https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.repository }}/main/README.md" | md5sum | awk '{print $1}')
            if [ "$LOCAL_HASH" == "$REMOTE_HASH" ]; then
              echo "✅ Success! GitHub server is synced at attempt $i."
              exit 0
            fi
            echo "⏳ Not synced yet. Waiting 5 seconds... (Attempt $i/15)"
            sleep 5
          done

  # জব ৫: ডেটা জেনারেট এবং ভেরিফাই করা
  generate-and-verify-apis:
    needs: wait-for-github-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Hit and Verify APIs
        run: |
          echo "Hitting external APIs to generate data and verifying status..."
          grep -oE 'https?://[^ )">]+' README.md | while read -r URL; do
            if [[ "$URL" == *"vercel.app"* ]] || [[ "$URL" == *"demolab.com"* ]] || [[ "$URL" == *"githubusercontent"* ]]; then
              for i in {1..10}; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                if [ "$STATUS" -eq 200 ]; then
                  echo "✅ Data successfully generated and cached by API: $URL"
                  break
                fi
                sleep 2
              done
            fi
          done

  # জব ৬: প্রোফাইল রিফ্রেশ
  final-profile-refresh:
    needs: generate-and-verify-apis
    runs-on: ubuntu-latest
    steps:
      - name: Force Refresh Profile Page
        run: |
          echo "🔥 Forcing GitHub to load new images..."
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository_owner }}"
          curl -H "Cache-Control: no-cache" -H "Pragma: no-cache" -s -o /dev/null "https://github.com/${{ github.repository }}"
          echo "🎉 Done! Everything is perfectly updated."
