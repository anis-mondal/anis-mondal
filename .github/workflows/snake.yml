name: Generate Snake

on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#38b6ff&color_dots=#ebf2f6,#8dbdff,#64a1f4,#4b91f1,#38b6ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38b6ff&color_dots=#1a1b26,#164c48,#1a7c6a,#1fbb95,#73daca
      
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
